const paths={clip:'M9 4h6v3H9z M9 5H6v16h12V5h-3',shot:'M8 3H5v4 M16 3h3v4 M19 17v4h-3 M8 21H5v-4 M3 9h18v6H3z',pin:'M8 3h8l-1 6 3 4v2H6v-2l3-4z M12 15v7',ocr:'M4 7V4h4 M16 4h4v3 M4 17v3h4 M16 20h4v-3 M8 9h8 M12 9v7',star:'m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z',eye:'M2 12s3-6 10-6 10 6 10 6-3 6-10 6S2 12 2 12z M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6',search:'m16 16 5 5 M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',text:'M4 5h16 M12 5v15 M8 20h8',file:'M14 2H5v20h14V7z M14 2v6h5 M8 12h8 M8 16h6',image:'M3 3h18v18H3z m0 13 6-6 5 5 3-3 4 4 M16 7h.01',settings:'M12 3v3 M12 18v3 M3 12h3 M18 12h3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2 M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8',phrase:'M3 4h18v13H9l-6 4z M7 8h10 M7 12h7',minus:'M5 12h14',close:'m6 6 12 12 M18 6 6 18',fold:'m6 14 6-6 6 6',play:'m8 5 11 7-11 7z',pause:'M8 5v14 M16 5v14',check:'m5 12 4 4L19 6',down:'M12 3v12 m-5-5 5 5 5-5 M4 17v4h16v-4'};
const icon=(name,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.file}"></path></svg>`;
const pic=`<svg viewBox="0 0 64 40" style="width:64px;height:40px;stroke:none"><rect width="64" height="40" fill="#e3ecd7"/><circle cx="49" cy="10" r="5" fill="#d2b77c"/><path d="M0 32 22 11l19 21 12-12 11 12v8H0z" fill="#739477"/><path d="m0 37 19-15 25 18H0z" fill="#486e53"/></svg>`;
const chapters=[['剪贴板','复制过的，都有迹可循','文字和图片按日归档，点一下就插入之前的编辑位置。'],['搜索与收藏','少翻找，多一点顺手','搜索跨日期记录；常用内容收藏起来，收藏图标变为填充色。'],['预览与格式','先看清，再保留格式','默认纯文本粘贴；按需勾选带格式粘贴，预览中可以编辑并保存。'],['贴图与识字','框在哪里，就留在哪里','截图自动复制；贴图保持原位置与原尺寸，可折叠、缩放及展开识别文字。'],['离线转换','文件拖进来，结果留原处','批量 Word ⇄ PDF，可暂停、继续和取消；进度按完成文件数显示。'],['桌面习惯','常驻手边，也懂得收起','按需置顶，配置快捷键和保留规则；收起到托盘，转换继续在后台进行。'],['拾光','让工作，接着走','Windows 桌面工具 · 可公开修改的源码 · 转换组件首次按需下载。']];
const nav=$('chapters');
chapters.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.innerHTML=`<span>${String(i+1).padStart(2,'0')} / ${String(i*10).padStart(2,'0')}s</span>${c[0]}`;b.addEventListener('click',()=>seek(i*10));nav.appendChild(b);});
const box=on=>`<span class="box ${on?'checked':''}">${on?'✓':''}</span>`;
const row=(title,note,kind='text',saved=false,focus=false,source='剪贴板')=>`<div class="row ${focus?'focus':''}"><span class="visual ${kind==='image'?'picture':''}">${kind==='image'?pic:icon(kind)}</span><div class="rowtext"><strong>${title}</strong><p>${note}</p></div><span class="time">10:24</span><span class="source">${source}</span><span class="actions">${icon('star',saved?'saved':'')}${icon('eye')}</span></div>`;
function shell(content,tab=0,dates=true){return `<div class="app"><div class="titlebar"><img src="${BRAND}" alt=""><span class="app-brand">拾光</span><span class="sub">桌面工具</span><div class="tools"><span>${icon('shot')}截图</span><span>${icon('pin')}贴图</span><span>${icon('ocr')}识字</span></div><div class="win"><span class="selected">${icon('pin')}</span>${icon('minus')}${icon('close')}</div></div><div class="nav">${['剪贴板','收藏','常用短语','文件转换'].map((n,i)=>`<span class="${i===tab?'on':''}">${icon(['clip','star','phrase','file'][i])}${n}</span>`).join('')}</div><div class="body">${dates?`<aside class="dates"><small>最近七天</small>${['今天','昨天','10 月 20 日','10 月 19 日','10 月 18 日','10 月 17 日','10 月 16 日'].map((d,i)=>`<span class="${i===0?'today':''}">${d}</span>`).join('')}<span class="keep">普通记录保留 7 天<br>收藏与短语长期保留</span></aside>`:''}${content}</div><div class="footer"><i class="dot"></i>正在记录<span class="end">本地保存 · 七天历史 ${icon('settings')}</span></div></div>`;}
function history({title='今天',search='',formatted=false,rows='',count=3}={}){return `<div class="history"><div class="search">${icon('search')}${search?`<b>${search}</b>`:'搜索最近七天的记录'}</div><div class="heading"><div><h2>${title}</h2><small>${search?'跨日期搜索':'10 月 22 日 · 星期四'}</small></div><small>${count} 条</small></div><div class="filters"><span class="active">全部</span><span>文字</span><span>图片</span><span class="check">${box(formatted)}带格式粘贴</span></div>${rows}</div>`;}
const standardRows=focus=>row('把灵感留在手边，让工作接着走。','复制文字、图片，都能在这里找到。','text',false,focus)+row('图片 · 640 × 400','截图记录 · 点击插入图片','image',false,false,'拾光截图')+row('产品方案 · 本周待办','整理需求 → 设计界面 → 交付预览','file',true,false,'Word');
function pointer(x,y,ring=false){return `${ring?`<span class="clickring" style="left:${x-8}px;top:${y-8}px"></span>`:''}<span class="cursor" style="left:${x}px;top:${y}px"><svg viewBox="0 0 24 30"><path d="M3 2v23l6-6 5 9 4-2-5-9h9z"></path></svg></span>`;}
function clipboard(s){return shell(history({rows:standardRows(s===1)}))+ (s===0?'<div class="tag light" style="left:375px;top:521px">文字 + 图片，自动保存到本地</div>':s===1?pointer(550,278,true):`<div class="word"><div class="wordbar">目标文档 · 编辑位置</div><div class="wordpaper">${s===2?'':'把灵感留在手边，让工作接着走。'}<span class="caret">&nbsp;</span></div></div><div class="tag" style="left:256px;top:528px">点击一条，继续当前编辑</div>`);}
function searchScene(s){let title=s<2?'搜索结果':'收藏',q=s<2?'产品方案':'';let rows=row('产品方案 · 本周待办','整理需求 → 设计界面 → 交付预览','file',s>0,s<2,'Word')+row('产品方案讨论要点','操作简单，常用功能一步直达。','text',true);return shell(history({title,search:q,rows,count:2}),s<2?0:1,s<2)+(s===0?pointer(443,168):s===1?pointer(882,296,true):'<div class="tag" style="left:407px;top:495px">收藏与常用短语，随时取用</div>');}
function formatScene(s){return shell(history({rows:standardRows(false),formatted:s>0}))+`<div style="position:absolute;left:152px;top:48px;width:796px;height:520px"><div class="shade"><div class="dialog"><div class="dialog-head"><h3>内容预览</h3><span>${icon('close')}</span></div><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><span class="check" style="margin:0">${box(s!==2)}带格式预览</span><span class="pill">${s===3?'保存修改':'编辑内容'}</span></div><div class="previewtext ${s===3?'editing':''}">${s===2?'产品方案<br>让操作更简单，把时间留给重要的事。':`<h4>产品方案${s===3?' · 已更新':''}</h4><p>让操作更简单，把时间留给<b>重要的事</b>。</p><p style="font-size:11px;color:#819284">保留标题、粗体与文字颜色</p>`}</div><div class="dialog-foot"><span>预览格式与粘贴格式独立选择</span><span class="pill primary">${s===3?'保存':'复制内容'}</span></div></div></div></div>`+(s===0?'<div class="tag light" style="left:346px;top:533px">预览默认带格式，粘贴默认纯文本</div>':s===1?'<div class="tag" style="left:362px;top:533px">开启后，后续粘贴保留已有格式</div>':s===2?pointer(405,244,true):pointer(732,456,true));}
const clipText='把灵感留在手边，让工作接着走。<br>Keep ideas close. Keep work moving.';
function pinScene(s){const paper=`<div class="shotpaper"><h2>灵感备忘</h2><p>${clipText}</p><p style="color:#9aab95;font-size:12px;margin-top:26px">选中需要的区域</p></div>`;if(s===0)return paper+'<div class="capture-dim"></div><div class="selection"><span class="size">556 × 122 · 贴图</span></div>'+pointer(785,348);if(s===2)return paper+`<div class="pin-mini">${icon('pin')}</div><div class="tag light" style="left:400px;top:450px">折叠在原按钮位置，小图标也能拖动</div>`;return paper+`<div class="pin"><div class="clip">${clipText}</div>${s===1?`<span class="pin-action">${icon('fold')}</span>`:''}</div>`+(s===1?pointer(767,239,true):s===3?`<div class="context"><span>复制图片</span><span class="on">提取图片文字</span><span>删除贴图</span></div>`:`<div class="pinocr"><div class="ocrbar"><span>提取文字 · 按原行显示</span><span>收回⌃</span></div>把灵感留在手边，让工作接着走。<br>Keep ideas close. Keep work moving.<div style="text-align:right;margin-top:8px"><span class="pill">复制文字</span></div></div><div class="tag" style="left:340px;top:524px">提取后展开文字，手动点击才复制</div>`);}
function convertScene(s){let done=s===0?0:s===1?1:s===2?1:s===3?2:3;let names=['产品方案.docx','会议纪要.docx','使用说明.pdf'];let statuses=names.map((n,i)=>i<done?'已完成':s===2&&i===done?'已暂停':i===done?'转换中':'排队中');return shell(`<div class="conversion"><h2>文件转换</h2><p>Word ⇄ PDF · 本地离线处理</p><div class="drop">${icon('file')}<strong>拖入 Word 或 PDF 文件</strong><small>支持批量 · 保存到原文件夹 · 原文件保留</small></div><div class="ctabs"><b>${s===4?'已转换 3':'未转换 '+(3-done)}</b><span>${s===4?'未转换 0':'已转换 '+done}</span><span class="right">${s===2?'▷ 继续　 × 取消':s===4?'全选　 删除记录':'Ⅱ 暂停　 × 取消'}</span></div>${names.map((n,i)=>`<div class="job"><span class="fileicon">${icon('file')}</span><span class="info">${n}<small>${i<done?'已保存到来源文件夹':s===2&&i===done?'继续后从该文件开头重新转换':'默认保存到来源文件夹'}</small></span><span class="status ${i>done?'wait':''}">${statuses[i]}</span></div>`).join('')}<div class="total"><div><span>${s===2?'转换已暂停':s===4?'全部转换完成':'正在处理转换队列'}</span><span>已完成 ${done} / 3</span></div><div class="track"><i style="width:${done/3*100}%"></i></div><small>按成功文件数显示进度；当前文件不估算百分比 · 演示</small></div></div>`,3,false)+(s===0?'<div class="tag" style="left:387px;top:515px">拖入多个文件，自动排队处理</div>':s===2?'<div class="tag light" style="left:352px;top:514px">暂停保留已完成文件，继续时重做当前文件</div>':s===4?'<div class="tag" style="left:370px;top:515px">删除转换记录，不删除生成文件</div>':'');}
function settingsScene(s){return shell(history({rows:standardRows(false)}))+`<div style="position:absolute;left:152px;top:48px;width:796px;height:520px"><div class="shade"><div class="dialog settings"><div class="dialog-head"><h3>设置</h3>${icon('close')}</div>${s<2?`<div class="setting"><div>全局快捷键<small>剪贴板、截图、贴图与框选识字</small></div><span class="key">自定义组合键</span></div><div class="setting"><div>普通记录保留<small>收藏与常用短语单独保留</small></div><span class="key">7 天</span></div><div class="setting"><div>关闭窗口后收起到托盘<small>后台任务继续进行</small></div><span class="toggle"></span></div><div class="setting"><div>窗口置顶<small>也可点击标题栏图钉切换</small></div><span class="toggle"></span></div>`:`<div class="setting"><div>离线转换组件<small>首次按需下载约 303 MiB · 建议预留 2 GB</small></div>${icon('down')}</div><div style="padding:18px 0"><b style="color:#37684e;font-size:13px">离线组件已就绪</b><div class="track" style="margin-top:12px"><i style="width:100%"></i></div><p class="sub">独立环境 · 自动配置 · 不改变系统 Python</p><p class="sub">下载联网，转换文件在本机处理。</p></div>`}<div class="dialog-foot"><span>设置简洁，常用操作一步直达</span><span class="pill primary">保存</span></div></div></div></div>`+(s===1?'<div class="tag light" style="left:385px;top:524px">想留在顶层，再选中图钉</div>':'');}
function ending(){return `<div class="ending"><img src="${BRAND}" alt=""><h2>拾光</h2><p>把顺手的小事，留在手边。</p><div class="endtags"><span>Windows</span><span>源码公开</span><span>AGPL-3.0</span></div><p style="font-size:12px;margin-top:30px">github.com/p516757794/shiguang</p></div>`;}
let time=0,playing=false,speed=1,last=0,key='',chapter=-1;
function substate(c,t){if(c===0)return Math.min(3,Math.floor(t/2.5));if(c===1)return Math.min(2,Math.floor(t/3));if(c===2)return Math.min(3,Math.floor(t/2.5));if(c===3)return Math.min(4,Math.floor(t/2));if(c===4)return Math.min(4,Math.floor(t/2));if(c===5)return Math.min(2,Math.floor(t/3.5));return 0;}
function render(){let c=Math.min(6,Math.floor(time/10)),s=substate(c,time-c*10),next=c+':'+s;if(next!==key){$('scene').innerHTML=[clipboard,searchScene,formatScene,pinScene,convertScene,settingsScene,ending][c](s);key=next;}if(c!==chapter){chapter=c;$('number').textContent=String(c+1).padStart(2,'0');$('caption-title').textContent=chapters[c][1];$('caption-text').textContent=chapters[c][2];[...nav.children].forEach((b,i)=>b.setAttribute('aria-current',String(i===c)));}if(document.activeElement!==$('seek'))$('seek').value=time;$('clock').textContent=stamp(time)+' / 01:10';}
function stamp(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.floor(n%60)).padStart(2,'0');}
function setPlaying(value){playing=value;$('play').textContent=value?'Ⅱ 暂停':'▶ 播放';$('play').setAttribute('aria-label',value?'暂停演示':'播放演示');$('player').classList.toggle('paused',!value);last=performance.now();}
function seek(n){time=Math.max(0,Math.min(70,n));key='';render();last=performance.now();}
$('play').addEventListener('click',()=>{if(time>=70)seek(0);setPlaying(!playing);});
$('restart').addEventListener('click',()=>{seek(0);setPlaying(true);});
$('seek').addEventListener('input',e=>seek(Number(e.target.value)));
$('speed').addEventListener('change',e=>{speed=Number(e.target.value);last=performance.now();});
$('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if($('player').requestFullscreen)await $('player').requestFullscreen();else $('fullscreen').textContent='浏览器不支持全屏';}catch{$('fullscreen').textContent='请用浏览器全屏';}});
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA','BUTTON','A'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();if(time>=70)seek(0);setPlaying(!playing);}if(e.code==='ArrowRight'){e.preventDefault();seek(time+5);}if(e.code==='ArrowLeft'){e.preventDefault();seek(time-5);}});
document.addEventListener('visibilitychange',()=>{last=performance.now();});
function resize(){$('screen').style.transform=`scale(${$('stage').clientWidth/1100})`;}
new ResizeObserver(resize).observe($('stage'));
function frame(now){if(playing&&!document.hidden){time=Math.min(70,time+Math.min(.1,(now-last)/1000)*speed);if(time>=70)setPlaying(false);render();}last=now;requestAnimationFrame(frame);}
resize();render();setPlaying(!matchMedia('(prefers-reduced-motion: reduce)').matches);requestAnimationFrame(frame);
})();
</script>
</body>
</html>
